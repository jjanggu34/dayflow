<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>DAYFLOW — 교환일기 방</title>
    <link rel="stylesheet" href="/assets/css/main.css" />
    <style>
      .exchange-row {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-bottom: 10px;
      }
      .exchange-log {
        list-style: none;
        padding: 0;
        margin: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .exchange-log li {
        padding: 10px;
        border-radius: 10px;
        background: #f7f7f9;
      }
      .exchange-log .mine {
        background: #e8f0ff;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header class="headerWrap" role="banner">
        <button type="button" class="back" id="exchangeRoomBackBtn" aria-label="뒤로">뒤로</button>
        <h1><span>교환일기 방</span></h1>
      </header>
      <div id="bodyWrap" style="padding: 16px">
        <main>
          <p id="exchangePartnerLine" style="margin: 0 0 6px 0; font-size: 14px; font-weight: 600; color: #191f28">상대: 불러오는 중…</p>
          <p id="exchangeTimeLine" style="margin: 0 0 12px 0; font-size: 12px; color: #666">이동 시각: —</p>
          <section id="exchangeContextPanel" hidden style="margin-bottom: 14px; padding: 12px; border-radius: 12px; background: #f7f9fc; border: 1px solid #edf1f6">
            <p style="margin: 0 0 6px; font-size: 12px; color: #666">오늘 채팅 요약</p>
            <p id="exchangeSummaryBody" style="margin: 0; font-size: 14px; line-height: 1.55; color: #191f28">—</p>
            <p style="margin: 10px 0 0; font-size: 12px; color: #888">공감은 아래 입력란에 댓글로 남겨 주세요.</p>
          </section>
          <div class="exchange-row" style="justify-content: space-between">
            <p id="exchangeRoomMeta" style="font-size: 13px; color: #666; margin: 0">초대코드: 불러오는 중…</p>
            <div style="display: flex; gap: 6px">
              <button id="exchangeCopyCodeBtn" type="button" class="btn-sub" style="height: 36px">코드 복사</button>
              <button id="exchangeCopyLinkBtn" type="button" class="btn-sub" style="height: 36px">링크 복사</button>
            </div>
          </div>
          <p id="exchangeFirstPreview" style="font-size: 13px; color: #666; margin: 0 0 10px 0">첫 기록을 불러오는 중…</p>
          <div class="exchange-row" hidden>
            <label for="exchangeDate">날짜</label>
            <input id="exchangeDate" type="date" />
            <button id="exchangeLoadBtn" type="button" class="btn-sub">불러오기</button>
          </div>
          <ul id="exchangeEntryList" class="exchange-log"></ul>
        </main>
      </div>
      <footer style="padding: 12px 16px; border-top: 1px solid #eee">
        <div style="display: flex; gap: 8px; align-items: stretch">
          <textarea id="exchangeInput" rows="2" style="flex: 1; border: 1px solid #ddd; border-radius: 8px; padding: 8px" placeholder="오늘의 교환일기를 남겨보세요"></textarea>
          <div style="display: flex; flex-direction: column; gap: 6px; width: 92px">
            <button id="exchangeSendBtn" type="button" class="btn-ctp" style="width: 100%; flex: 1; min-height: 44px">보내기</button>
            <button id="exchangeEditCancelBtn" type="button" class="btn-sub" style="display: none; width: 100%; height: 36px; font-size: 12px">취소</button>
          </div>
        </div>
      </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="/assets/js/config/supabase-config.js"></script>
    <script src="/assets/js/agents/authAgent.js"></script>
    <script src="/assets/js/domain/exchangeStore.js"></script>
    <script src="/assets/js/view/exchange-room.js"></script>
  </body>
</html>
